name: Build StockMotion Studio 4K AI Image-to-Video

on:
  workflow_dispatch:
  push:
    branches:
      - ai-image-to-video-rebuild

permissions:
  contents: read

env:
  PROJECT_ZIP: StockMotionStudio4K-MVP03.3-layout-ratio-source.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ai-image-to-video-rebuild

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract preserved MVP 0.3.3 source
        run: |
          test -f "$PROJECT_ZIP" || { echo "Missing $PROJECT_ZIP"; exit 1; }
          mkdir -p source
          unzip -q "$PROJECT_ZIP" -d source
          SETTINGS_FILE="$(find source -name settings.gradle -print -quit)"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -n "$PROJECT_DIR" || { echo "Gradle project not found in ZIP"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Overlay AI Image-to-Video and Showcase implementation
        run: |
          cp .rebuild/app.build.gradle "$PROJECT_DIR/app/build.gradle"
          cp .rebuild/AndroidManifest.xml "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          mkdir -p "$PROJECT_DIR/app/src/main/java"
          cp -R .rebuild/app/src/main/java/. "$PROJECT_DIR/app/src/main/java/"

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMotion-Studio-4K-0.5.1-debug
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
